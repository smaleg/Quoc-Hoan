
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TỪ NGỮ TẠNG VIỆT vision 1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tibetan:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tibetan-red: #8B0000;
            --tibetan-gold: #D4AF37;
            --tibetan-dark: #1a1a1a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #e2e8f0;
        }
        .tibetan-font {
            font-family: 'Noto Sans Tibetan', serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
        }
        .red-gradient {
            background: linear-gradient(135deg, #8B0000 0%, #B22222 100%);
        }
        .glass-card {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .animate-spin-slow {
            animation: spin 10s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: var(--tibetan-gold); border-radius: 10px; }
    </style>

</head>
